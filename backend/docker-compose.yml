version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: gpu-config-recommender-backend
    ports:
      - "8000:8000"
    environment:
      # Optional: Add your HuggingFace token for gated models
      # - HF_TOKEN=${HF_TOKEN}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Optional: Add volumes for persistent data or logs
    # volumes:
    #   - ./logs:/app/logs
